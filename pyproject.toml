[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelcam"
version = "0.15.0"
description = "Local parametric wheel concept workbench"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "cadquery>=2.6,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "manifold3d>=3,<4",
    "trimesh>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["services"]

[tool.setuptools.package-data]
wheelcam = ["workbench.html", "static/three/LICENSE", "static/three/build/*.js", "static/three/examples/jsm/*/*.js"]

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests", "experiments/annotate", "experiments/genviews"]
