[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelcam"
version = "0.3.0"
description = "Local parametric wheel concept workbench"
requires-python = ">=3.12,<3.14"
dependencies = ["cadquery>=2.6,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["services"]

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]
