<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WheelCAM 工作台</title>
<style>
:root{--bg:#f4f3f0;--panel:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e2e0da;--ok:#2f7d4f;--bad:#b3261e;--warn:#9a6700;--accent:#1f4fbf}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe7;--mute:#9b9a95;--line:#34332f;--ok:#6fc28f;--bad:#f08a80;--warn:#e0b050;--accent:#8fb0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600}
header .chip{font-size:12px;padding:2px 8px;border:1px solid var(--bad);color:var(--bad);border-radius:10px}
header button{font:inherit;padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
dialog{max-width:min(650px,92vw);width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px}
dialog::backdrop{background:#0008}dialog textarea{font:inherit;width:100%;height:110px;padding:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
dialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}dialog button{font:inherit;padding:7px 12px;cursor:pointer}
select{font:inherit;padding:4px 6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);height:calc(100vh - 49px)}
#view{position:relative;min-height:320px}
#view canvas{display:block;width:100%;height:100%}
#view .hint{position:absolute;left:12px;bottom:10px;color:var(--mute);font-size:12px}
#chain{position:absolute;left:12px;top:10px;display:flex;flex-wrap:wrap;gap:6px}
#chain span{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
#chain span.ok::before{content:"✓ ";color:var(--ok)}#chain span.bad::before{content:"✗ ";color:var(--bad)}
aside{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
nav{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{flex:none;font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mute);cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab{display:none;padding:14px 16px;overflow:auto;flex:1;min-height:0}.tab.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:500}
.pass{color:var(--ok)}.fail{color:var(--bad)}.note{color:var(--warn)}
img.fig{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
h3{font-size:13px;margin:16px 0 6px;color:var(--mute);font-weight:500}
a{color:var(--accent)}
#chat{display:none;flex-direction:column;flex:1;min-height:0}#chat.on{display:flex}
#log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:8px 10px;border-radius:8px}
.me{align-self:flex-end;background:var(--accent);color:#fff}
.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.bot .x{font-size:12px;color:var(--mute);margin-top:4px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
form input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
form button{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
form button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chips button{font:inherit;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink);cursor:pointer}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#view{height:55vh}aside{min-height:70vh}}
</style>
</head>
<body>
<header>
  <h1>WheelCAM 工作台</h1>
  <select id="run"></select>
  <button id="new-text">用文字新建</button>
  <button id="new-image">用图片新建</button>
  <button id="confirm-spec" disabled>确认工程尺寸</button>
  <button id="deliver" disabled>生成当前版本交付包</button>
  <span id="task-status" role="status"></span>
  <button id="reset-preview" hidden>恢复原始预览</button>
  <span class="chip">未发布 · 需工程师审核</span>
</header>
<dialog id="text-dialog"><h2>用文字新建轮毂</h2><p>写下尺寸和造型。未提供的工程规格会标为默认值，生成结果需工程师审核。</p>
  <textarea id="text-input" placeholder="20×10.5 ET15，5×112，中心孔 66.6，孔型 15X32X60。做 5 辐直辐，外圈加 15 个盲窗。"></textarea>
  <p id="text-status" role="status"></p><div class="actions"><button id="text-cancel">取消</button><button id="text-submit">生成草案</button></div></dialog>
<dialog id="engineering-dialog">
  <h2 id="engineering-title">确认工程尺寸</h2>
  <p>只填写已知尺寸；空白项保留为未知或沿用原值。修改后生成新版本，重新校验。</p>
  <div id="image-fields"><label>正面图（必填） <input id="front-file" type="file" accept="image/jpeg,image/png,image/webp"></label><br>
    <label>斜视图（可选） <input id="oblique-file" type="file" accept="image/jpeg,image/png,image/webp"></label></div>
  <div id="engineering-fields"></div>
  <label>孔型 <input id="hole-form" placeholder="15X32X60"></label>
  <p id="dimension-diff"></p>
  <label><input id="engineering-confirmed" type="checkbox">我确认填写的工程尺寸来自本次设计要求或测量</label>
  <p id="engineering-status" role="status"></p>
  <div class="actions"><button id="engineering-cancel">取消</button><button id="engineering-submit">确认并重建</button></div>
</dialog>
<main>
  <section id="view"><div id="chain"></div><div class="hint">拖动旋转 · 滚轮缩放</div></section>
  <aside>
    <nav id="tabs">
      <button data-t="spec" class="on">规格与校验</button>
      <button data-t="ref">对照原图</button>
      <button data-t="cad">对照工厂 CAD</button>
      <button data-t="drawing">工程图</button>
      <button data-t="cam">加工</button>
      <button data-t="chat">对话修改</button>
    </nav>
    <div class="tab on" id="spec"></div>
    <div class="tab" id="ref"></div>
    <div class="tab" id="cad"></div>
    <div class="tab" id="drawing"></div>
    <div class="tab" id="cam"></div>
    <div id="chat">
      <div id="log"></div>
      <div class="chips">
        <button>辐条中间的脊再高一点</button><button>窗口斜面窄一些</button>
        <button>中心凹谷浅一点</button><button>把 PCD 改成 114.3</button>
      </div>
      <form id="ask"><input id="q" placeholder="描述想要的造型变化，例如：凹度再深 5 毫米" autocomplete="off"><button>发送</button></form>
    </div>
  </aside>
</main>
<script type="importmap">{"imports":{"three":"/static/three/build/three.module.js","three/addons/":"/static/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => v == null ? "—" : (typeof v === "number" ? (Math.round(v * 100) / 100).toString() : esc(v));
let run = null, data = null, busy = false;
function setBusy(value){ busy = value; document.querySelectorAll("header button, #run, #ask button, .chips button").forEach(b => b.disabled = value || (!data && ["confirm-spec", "deliver"].includes(b.id))); }

// 3D view
const view = $("#view"), renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(devicePixelRatio); renderer.toneMapping = THREE.ACESFilmicToneMapping;
view.prepend(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1, 10, 10000);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
let model = null;
function resize(){ const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
function bg(){ scene.background = new THREE.Color(getComputedStyle(document.body).getPropertyValue("--bg").trim()); }
bg(); matchMedia("(prefers-color-scheme:dark)").addEventListener("change", bg);
function loadGlb(url){
  new GLTFLoader().load(url, g => {
    if (model) scene.remove(model);
    model = g.scene;
    model.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({color: 0xb9bcc0, metalness: .85, roughness: .32}); });
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length();
    model.position.sub(c);
    if (!controls.userMoved) {
      const vertical = THREE.MathUtils.degToRad(camera.fov), horizontal = 2 * Math.atan(Math.tan(vertical / 2) * camera.aspect);
      const distance = (s / 2) / Math.sin(Math.min(vertical, horizontal) / 2) * 1.08;
      camera.position.set(.15, 1.3, .78).normalize().multiplyScalar(distance); controls.target.set(0, 0, 0);
    }
  });
}
controls.addEventListener("start", () => controls.userMoved = true);

// tabs
function selectTab(t){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  document.querySelectorAll(".tab").forEach(d => d.classList.toggle("on", d.id === t));
  $("#chat").classList.toggle("on", t === "chat");
}
$("#tabs").onclick = e => { if (e.target.dataset.t) selectTab(e.target.dataset.t); };

const LABEL = {single_valid_solid:"单一有效实体", outer_diameter:"外径", overall_width:"总宽", bolt_pattern:"孔系",
  offset_et:"ET", rotational_symmetry:"旋转对称", valid_single_solid:"单一有效实体", step_roundtrip:"STEP 回读",
  no_sliver_faces:"无碎面", lip_od_mm:"外径 mm", overall_width_mm:"总宽 mm", et_mm:"ET mm", pcd_mm:"PCD mm",
  bolts:"孔数", bolt_hole_d_mm:"螺栓孔 mm", center_bore_mm:"中心孔 mm"};
const STEP = {reconstruct:"重建", style:"造型 agent", machining:"加工级 STEP", package:"加工包", drawing:"工程图", compare:"CAD 对照"};
const f = p => `/files/${run}/${p}`;
const checksTable = c => `<table>${Object.entries(c || {}).map(([k, v]) =>
  `<tr><td>${LABEL[k] || esc(k)}</td><td class="${v.pass === false ? "fail" : v.pass ? "pass" : ""}">${v.pass === false ? "未通过" : v.pass ? "通过" : "—"}</td>
   <td>${num(v.measured_mm ?? v.derived_mm ?? v.holes_found ?? v.faces_under_5mm2 ?? "")}</td></tr>`).join("")}</table>`;

function render(){
  const ch = data.chain, sp = ch.spec, m = data.machining || {}, cmp = data.compare;
  const preview = data.current_preview || {}, stale = preview.downstream_stale;
  const versionNote = stale ? `<p class="note" role="status">当前版本 ${esc(preview.revision)} 的交付包尚未生成。${preview.revision?.startsWith("chat/") ? "下列已有文件对应修改前版本。" : ""}请点击“生成当前版本交付包”。</p>` : "";
  $("#reset-preview").hidden = !preview.revision?.startsWith("chat/");
  $("#confirm-spec").disabled = busy; $("#deliver").disabled = busy;
  $("#chain").innerHTML = ch.steps.map(s => `<span class="${s.ok ? "ok" : "bad"}" title="${esc(s.error || "")}">${STEP[s.step] || s.step} ${s.seconds}s</span>`).join("");
  $("#spec").innerHTML = `
    ${versionNote}
    ${ch.parent ? `<p>基于 ${esc(ch.parent.run)} 创建的新版本；历史版本可从顶部列表打开。</p>` : ""}
    <table><tr><th>规格（${ch.text ? "用户文字 / 已确认值 / 默认值" : "输入值；来源见下方"}）</th><th></th></tr>
    <tr><td>尺寸</td><td>${num(sp.diameter_in)}×${num(sp.width_in)}J  ET${num(sp.et_mm)}</td></tr>
    <tr><td>孔系</td><td>${num(sp.bolts)}×${num(sp.pcd_mm)}  中心孔 ${num(sp.center_bore_mm)}</td></tr>
    <tr><td>孔型</td><td>${esc(ch.hole_form || "确认单未给出")}</td></tr></table>
    ${ch.text ? `<p>${esc(ch.text)}</p><h3>输入来源与待确认</h3>
      <table>${Object.entries(data.text_report?.parameters || {}).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v.value)}</td><td>${esc(v.source)}</td></tr>`).join("")}</table>
      ${(data.text_report?.questions || []).map(q => `<p class="note">${esc(q)}</p>`).join("")}` : ""}
    ${!ch.text ? understandingPanel(data.reconstruct) : ""}
    <h3>当前网格预览校验（L0 · ${esc(preview.revision || "reconstruct")}）</h3>${checksTable(preview.checks || data.reconstruct.checks)}
    ${agentPanel(data.style_agent)}
    <h3>加工级 STEP 校验${stale ? "（原始版本）" : ""}</h3>${checksTable(m.checks)}
    ${(m.adjustments || []).map(a => `<p class="note">⚠ ${esc(a)}</p>`).join("")}
    <h3>STEP 中包含 / 不包含</h3><p>${esc((m.in_step || []).join("；"))}</p><p class="note">${esc((m.not_in_step || []).join("；"))}</p>
    <p>${ch.steps.some(s => s.step === "machining" && s.ok) ? `<a href="${f("machining/machining.step")}">下载 machining.step</a> · <a href="${f("machining/stock.step")}">stock.step</a> · ` : ""}<a href="${f(data.glb)}">wheel.glb</a></p>`;
  $("#ref").innerHTML = (data.references || []).length ? `<p>本次输入参考图。左侧三维模型可拖动到相同视角对照。</p>` +
    data.references.map(n => `<img class="fig" style="margin-bottom:10px" src="${f("reference/" + n)}" alt="${esc(n)}">`).join("")
    : "<p>这次运行没有保存参考图。</p>";
  $("#cad").innerHTML = cmp ? `${versionNote}
    ${ch.parent ? `<p>基于 ${esc(ch.parent.run)} 创建的新版本；历史版本可从顶部列表打开。</p>` : ""}
    <table><tr><th>尺寸</th><th>重建</th><th>工厂 CAD</th><th>误差</th></tr>
    ${Object.entries(cmp.dimensions).map(([k, v]) => `<tr><td>${LABEL[k] || k}</td><td>${num(v.reconstruction)}</td><td>${num(v.cad)}</td>
      <td class="${v.error != null && Math.abs(v.error) > 1 ? "note" : ""}">${num(v.error)}</td></tr>`).join("")}</table>
    <h3>截面：轮辋中位误差 ${num(cmp.section_rim.median_mm)} mm（P90 ${num(cmp.section_rim.p90_mm)}），轮毂 ${num(cmp.section_hub.median_mm)} mm</h3>
    <img class="fig" src="${f("compare_section.png")}" alt="截面对照">
    <p class="note">工厂 CAD 只作对照真值，不作输入。截面对照不含辐条。本批 CAD 曾用于模板标定，以上为同批残差，不代表新款精度。</p>` : "<p>没有工厂 CAD。</p>";
  const pdf = (ch.steps.find(s => s.step === "drawing") || {}).pdf;
  $("#drawing").innerHTML = !ch.steps.some(s => s.step === "drawing" && s.ok) ? `${versionNote}<p>当前版本尚无通过的工程图，请生成交付包。</p>` : `${versionNote}<p>${pdf ? `<a href="${f("drawing.pdf")}" target="_blank">打开 A3 PDF</a> · ` : ""}<a href="${f("drawing.svg")}" target="_blank">SVG（A3，可直接打印）</a></p>
    <img class="fig" src="${f("drawing.svg")}" alt="工程图">`;
  const sim = data.simulation || {};
  const packageStep = ch.steps.find(s => s.step === "package");
  $("#cam").innerHTML = packageStep?.ok !== true ? `${versionNote}<h3>加工准备未完成</h3><p class="fail">${esc(packageStep?.error || "本次运行没有加工包结果。")}</p><p>当前预览与 STEP 仍可单独检查；加工包未通过，不能作为加工依据。</p>` : `${versionNote}<p><b>${esc(sim.conclusion || sim.status || "")}</b></p>
    <img class="fig" src="${f("package/simulation_3d.png")}" alt="加工仿真">
    <p><a href="${f("package/process_plan.json")}" target="_blank">工序单</a> · <a href="${f("package/tool_list.csv")}">刀具表</a> ·
    <a href="${f("package/reference.nc")}" target="_blank">参考轨迹 reference.nc</a></p>
    <p class="note">参考轨迹的运动行均为注释，不能上机；曲面精加工、夹具、切削参数交工厂 CAM。</p>`;
  $("#log").innerHTML = data.history.map(bubble).join("");
  $("#log").scrollTop = 1e9;
  loadGlb(f(data.glb));
}
function understandingPanel(report){
  const groups = report.engineering_understanding?.evidence_groups || {};
  const titles = {supplied:"已提供",observed:"图上观察候选",estimated:"规则估计",defaulted:"模板默认",unknown:"仍未知"};
  return `<h3>工程理解与来源</h3>${Object.entries(titles).map(([group,title]) => {
    const entries = Object.entries(groups[group] || {});
    return entries.length ? `<details${["supplied","unknown"].includes(group) ? " open" : ""}><summary>${title} · ${entries.length} 项</summary><table>${entries.map(([key,v]) => `<tr><td>${LABEL[key] || esc(key)}</td><td>${num(v.value)}</td><td>${esc(v.source)}${v.reason ? " · " + esc(v.reason) : ""}</td></tr>`).join("")}</table></details>` : "";
  }).join("")}${(report.questions || []).map(q => `<p class="note">${esc(q)}</p>`).join("")}`;
}
function agentPanel(a){
  if (!a) return "";
  const rows = a.steps.map(s => s.step === "look"
      ? `<tr><td>看</td><td>${esc(s.question)}：<b>${s.answer ? "有" : "没有"}</b>（p=${s.p_true}）${s.count ? `，计数 ${s.count.value}` : ""}</td></tr>`
    : s.step === "search"
      ? `<tr><td>搜</td><td>${esc(s.param)}：${s.scores.map(r => `${r.flank_w} mm → ${r.edge_mm}`).join("，")}${s.chosen ? `；选 ${s.chosen.flank_w} mm` : "；不改"}</td></tr>`
      : `<tr><td>验</td><td>${esc(s.result)}${s.checks_failed.length ? "：" + esc(s.checks_failed.join("、")) : ""}</td></tr>`).join("");
  const ch = Object.entries(a.changed || {}).filter(([k]) => k !== "lip_pocket_r").map(([k, v]) => `${k} ${v.from} → ${v.to}`).join("；");
  const comparison = data.style_comparison;
  const scores = comparison ? `<p>冻结配置复测：最终边缘距离 ${num(comparison.baseline.scores.edge_mm)} → ${num(comparison.candidate.scores.edge_mm)} mm；窗口 IoU ${num(comparison.baseline.scores.window_iou)} → ${num(comparison.candidate.scores.window_iou)}。</p><p class="note">同一输入图的拟合指标；不代表独立新款精度或制造精度。</p>` : "";
  return `<h3>造型 agent（原始重建的照片对照修正）</h3><table>${rows}</table><p>${ch ? "已修改：" + esc(ch) : "未修改"}</p>${scores}
    <p><img class="fig" style="width:49%" src="${f("reconstruct/style/before_render.png")}" alt="修正前"> <img class="fig" style="width:49%" src="${f("reconstruct/style/after_render.png")}" alt="修正后"></p>`;
}
function bubble(h){
  if (h.reset) return `<div class="msg bot">${esc(h.summary)}</div>`;
  const ch = Object.entries(h.changed || {}).map(([k, v]) => `${k}: ${v.from} → ${v.to}`).join("，");
  return `<div class="msg me">${esc(h.message)}</div><div class="msg bot">${esc(h.summary)}${ch ? `<div class="x">${esc(ch)}</div>` : ""}</div>`;
}

async function open(name){ run = name; data = await (await fetch(`/api/runs/${name}`)).json(); render(); }
const FIELDS = {diameter_in:"直径 inch",width_in:"宽度 J",et_mm:"ET mm",bolts:"螺栓孔数",pcd_mm:"PCD mm",center_bore_mm:"中心孔 mm"};
let imageMode = false, specRun = null, specHash = null;
function showEngineering(image){
  imageMode = image; specRun = run; specHash = data?.current_preview.recipe_sha256;
  $("#engineering-title").textContent = image ? "用图片新建轮毂" : "确认工程尺寸";
  $("#image-fields").hidden = !image;
  $("#engineering-fields").innerHTML = Object.entries(FIELDS).map(([k,label]) => `<p><label>${label} <input data-spec="${k}" type="number" step="${k === 'bolts' ? '1' : 'any'}" placeholder="${!image && data?.chain.spec[k] != null ? '当前 ' + data.chain.spec[k] + '；留空不确认' : '未知，可留空'}"></label></p>`).join("");
  $("#hole-form").value = ""; $("#engineering-confirmed").checked = false;
  $("#engineering-status").textContent = ""; $("#dimension-diff").textContent = "";
  $("#engineering-dialog").showModal();
}
function dimensionChanges(){
  return Object.fromEntries([...document.querySelectorAll('[data-spec]')].filter(e => e.value !== '').map(e => [e.dataset.spec, Number(e.value)]));
}
$("#engineering-fields").oninput = () => {
  $("#dimension-diff").textContent = Object.entries(dimensionChanges()).map(([k,v]) => `${FIELDS[k]}：${imageMode ? '未知' : data.chain.spec[k] ?? '未知'} → ${v}`).join('；');
};
$("#new-image").onclick = () => showEngineering(true);
$("#confirm-spec").onclick = () => showEngineering(false);
$("#engineering-cancel").onclick = () => $("#engineering-dialog").close();
async function acceptRun(result){
  const option = document.createElement('option'); option.textContent = result.name;
  $("#run").prepend(option); $("#run").value = result.name;
  controls.userMoved = false; selectTab('spec'); await open(result.name);
}
$("#engineering-submit").onclick = async () => {
  if (busy) return;
  const spec = dimensionChanges(), form = $("#hole-form").value.trim();
  if ((Object.keys(spec).length || form || !imageMode) && !$("#engineering-confirmed").checked){
    $("#engineering-status").textContent = "请勾选确认工程尺寸来源"; return;
  }
  if (imageMode && !$("#front-file").files[0]) { $("#engineering-status").textContent = "请选择正面图"; return; }
  setBusy(true); $("#engineering-submit").disabled = true;
  $("#engineering-status").textContent = "正在重建并校验，新版本完成后自动打开…";
  try {
    let url, options;
    if (imageMode){
      const body = new FormData(); body.append('front', $("#front-file").files[0]);
      if ($("#oblique-file").files[0]) body.append('oblique', $("#oblique-file").files[0]);
      body.append('spec_json', JSON.stringify(spec)); body.append('hole_form', form);
      url = '/api/runs/image'; options = {method:'POST',body};
    } else {
      url = `/api/runs/${specRun}/spec`;
      options = {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({expected_recipe_sha256:specHash,confirmed:true,spec,...(form ? {hole_form:form} : {})})};
    }
    const response = await fetch(url, options), result = await response.json();
    if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : JSON.stringify(result.detail));
    await acceptRun(result); $("#engineering-dialog").close();
  } catch(e){ $("#engineering-status").textContent = '未采用：' + e.message; }
  finally { setBusy(false); $("#engineering-submit").disabled = false; }
};
$("#deliver").onclick = async () => {
  if (busy || !data) return;
  const name = run, hash = data.current_preview.recipe_sha256;
  setBusy(true); $("#task-status").textContent = '正在生成当前配方的 STEP、图纸和加工包…';
  try {
    const response = await fetch(`/api/runs/${name}/deliver`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({expected_recipe_sha256:hash})});
    const result = await response.json(); if (!response.ok) throw new Error(result.detail);
    await acceptRun(result);
    const failed = result.chain.steps.filter(s => !s.ok);
    $("#task-status").textContent = failed.length ? '生成结束，部分步骤未通过，请查看校验结果' : '当前版本交付包已生成（工程草案）';
  } catch(e){ $("#task-status").textContent = '生成失败：' + e.message; }
  finally { setBusy(false); }
};
$("#new-text").onclick = () => $("#text-dialog").showModal();
$("#text-cancel").onclick = () => $("#text-dialog").close();
$("#text-submit").onclick = async () => {
  const message = $("#text-input").value.trim(); if (!message) return;
  if (busy) return; setBusy(true);
  const button = $("#text-submit"); button.disabled = true; $("#text-status").textContent = "理解、建模、校验中…";
  try {
    const response = await fetch("/api/runs/text", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({message})});
    const result = await response.json(); if (!response.ok) throw new Error(result.detail || "生成失败");
    const option = document.createElement("option"); option.textContent = result.name; $("#run").prepend(option); $("#run").value = result.name;
    $("#text-dialog").close(); controls.userMoved = false; selectTab("spec"); await open(result.name);
  } catch (error) { $("#text-status").textContent = "出错：" + error.message; }
  button.disabled = false; setBusy(false);
};
$("#run").onchange = e => { controls.userMoved = false; open(e.target.value); };
$("#reset-preview").onclick = async () => {
  const response = await fetch(`/api/runs/${run}/chat/reset`, {method:"POST"});
  if (response.ok) await open(run);
};
document.querySelector(".chips").onclick = e => { if (e.target.tagName === "BUTTON") { $("#q").value = e.target.textContent; $("#ask").requestSubmit(); } };
$("#ask").onsubmit = async e => {
  e.preventDefault();
  if (!data) return;
  const q = $("#q").value.trim(); if (!q) return;
  if (busy) return; setBusy(true);
  const btn = $("#ask button"); btn.disabled = true; $("#q").value = "";
  $("#log").insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div><div class="msg bot" id="wait">理解中，重建并校验…</div>`);
  $("#log").scrollTop = 1e9;
  try {
    const r = await fetch(`/api/runs/${run}/chat`, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({message: q})});
    if (!r.ok) throw new Error((await r.json()).detail);
    await open(run);
  } catch (err) { $("#wait").textContent = "出错：" + err.message; $("#wait").id = ""; }
  btn.disabled = false; setBusy(false);
};
const runs = await (await fetch("/api/runs")).json();
$("#run").innerHTML = runs.map(r => `<option>${esc(r)}</option>`).join("");
if (runs.length) open(runs[0]);
</script>
</body>
</html>
